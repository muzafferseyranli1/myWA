services:
  mywa-db:
    image: postgres:16-alpine
    container_name: mywa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mywa}
      POSTGRES_USER: ${POSTGRES_USER:-mywa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - mywa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mywa} -d ${POSTGRES_DB:-mywa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mywa-waha:
    image: devlikeapro/waha:latest
    container_name: mywa-waha
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-MyWA_123}
      - WHATSAPP_HOOK_URL=http://mywa-app:3060/api/whatsapp/webhook
      - WHATSAPP_HOOK_EVENTS=message,message.any,session.status
    volumes:
      - mywa_waha_sessions:/app/.sessions

  mywa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywa-app
    restart: unless-stopped
    ports:
      - "${PORT:-3060}:${PORT:-3060}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3060}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      WAHA_API_URL: http://mywa-waha:3000
      UPLOAD_DIR: /app/public/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-50}
      APP_URL: ${APP_URL:?APP_URL is required}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    volumes:
      - mywa_uploads:/app/public/uploads
    depends_on:
      mywa-db:
        condition: service_healthy
      mywa-waha:
        condition: service_started

volumes:
  mywa_pgdata:
    driver: local
  mywa_uploads:
    driver: local
  mywa_waha_sessions:
    driver: local
